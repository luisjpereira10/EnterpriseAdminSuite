<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<aside th:fragment="sidebar" class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <!--begin::Sidebar Brand-->
    <div class="sidebar-brand">
        <!--begin::Brand Link-->
        <a th:href="@{/}" class="brand-link">
            <!--begin::Brand Image-->
            <img
                    th:src="@{/assets/img/AdminLTELogo.png}"
                    alt="AdminLTE Logo"
                    class="brand-image opacity-75 shadow"
            />
            <!--end::Brand Image-->
            <!--begin::Brand Text-->
            <span class="brand-text fw-light">Dashboard</span>
            <!--end::Brand Text-->
        </a>
        <!--end::Brand Link-->
    </div>
    <!--end::Sidebar Brand-->
    <!--begin::Sidebar Wrapper-->
    <div class="sidebar-wrapper">
        <nav class="mt-2" aria-label="Main navigation">
            <!--begin::Sidebar Menu-->
            <ul
                    class="nav sidebar-menu flex-column"
                    data-lte-toggle="treeview"
                    data-accordion="false"
                    id="navigation"
            >
                <!-- Navigation Item: Dashboard -->
                <li class="nav-item">
                    <a th:href="@{/dashboard}" class="nav-link active">
                        <i class="nav-icon bi bi-speedometer"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                <!-- Placeholder Category Header for Future Modules -->
                <li class="nav-header">MANAGEMENT</li>

                <!-- Navigation Item: Users (Module Canvas) -->
                <li class="nav-item">
                    <a th:href="@{/users}" class="nav-link">
                        <i class="nav-icon bi bi-people-fill"></i>
                        <p>Users</p>
                    </a>
                </li>

                <!-- Navigation Item: Settings (Module Canvas) -->
                <li class="nav-item">
                    <a th:href="@{/settings}" class="nav-link">
                        <i class="nav-icon bi bi-gear-fill"></i>
                        <p>Settings</p>
                    </a>
                </li>
            </ul>
            <!--end::Sidebar Menu-->
        </nav>
    </div>
    <!--end::Sidebar Wrapper-->
</aside>

</html>
