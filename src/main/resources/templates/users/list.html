<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content">
        <!-- start::Header session -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">User Directory</h3>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
                <i class="bi bi-person-plus-fill me-1"></i> Add New User
            </button>
        </div>
        <!-- end::Header session -->

        <!-- start::table AdminLTE v4 Card -->
        <div class="card mb-4">
            <div class="card-header">
                <h3 class="card-title">Registered System Users</h3>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 10px"></th>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>1.</td>
                        <td><strong>Alex Developer</strong></td>
                        <td>alex@example.com</td>
                        <td><span class="badge text-bg-primary">Admin</span></td>
                        <td><span class="badge text-bg-success">Active</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- end::table AdminLTE v4 Card -->

        <!-- start::modal create user-->
        <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addUserModalLabel">
                            <i class="bi bi-person-plus me-1"></i> Create New User
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/users}" th:object="${userRequest}" method="post" novalidate>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text"
                                       class="form-control"
                                       id="fullName" name="fullName"
                                       placeholder="Enter full name"
                                       th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                >
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                                    Invalid full name
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email"
                                       class="form-control"
                                       id="email" name="email"
                                       placeholder="user@example.com"
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                >
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Invalid email address
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                th:field="*{password}"
                                th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                    Invalid password
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Repeat Password</label>
                                <input type="password" class="form-control" id="password-repeat" name="password-repeat"
                                th:field="*{confirmPassword}"
                                th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('confirmPassword')}"
                                     th:errors="*{confirmPassword}">
                                    Invalid password confirmation
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" name="role"
                                    th:field="*{role}"
                                    th:classappend="${#fields.hasErrors('role') ? 'is-invalid' : ''}">
                                    <option selected value="">Select a role...</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="USER">USER</option>
                                    <option value="MANAGER">MANAGER</option>
                                </select>
                            </div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">

                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- start::scripts required for this view (Inside th:fragment="content") -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- end::scripts required for this view (Inside th:fragment="content") -->

        <!-- Bootstrap 5 JavaScript Bundle (incluye Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Script to reopen the modal using the Bootstrap API when validation errors occur. -->
        <script th:if="${showModal}">
            document.addEventListener("DOMContentLoaded", function () {
              const addUserModalElement = document.getElementById("addUserModal");
              if (addUserModalElement) {
                const modalInstance = new bootstrap.Modal(addUserModalElement);
                modalInstance.show();
              }
            });
        </script>
    </div>

</body>
</html>
