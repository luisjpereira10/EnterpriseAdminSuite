<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content">
        <!-- start::Header session -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">User Directory</h3>
            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show mb-3"
                 role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible fade show mb-3"
                 role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal">
                <i class="bi bi-person-plus-fill me-1"></i> Add New User
            </button>
        </div>
        <!-- end::Header session -->

        <!-- start::table AdminLTE v4 Card -->
        <div class="card mb-4">
            <div class="card-header">
                <h3 class="card-title">Registered System Users</h3>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>creation date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <input type="hidden" id="userId" name="id">
                        <td><strong th:text="${user.fullName}"></strong></td>
                        <td th:text="${user.email}"></td>
                        <td><span th:text="${user.role}" class="badge text-bg-primary"></span></td>
                        <td th:text="${#temporals.format(user.created_At, 'dd-MM-yyyy HH:mm')}"></td>
                        <td class="text-end">
                            <button type="button"
                                    class="btn btn-sm btn-warning me-1"
                                    th:data-id="${user.id}"
                                    th:data-fullname="${user.fullName}"
                                    th:data-email="${user.email}"
                                    th:data-role="${user.role}"
                                    onclick="openModalForEdit(this)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <a th:href="@{/users/delete/{id}(id=${user.id})}"
                                class="btn btn-sm btn-danger"
                                onclick="return confirm('Are you sure you want to delete this user?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- end::table AdminLTE v4 Card -->

        <!-- start::modal create user-->
        <div id="userModal"
             class="modal fade"
             th:data-show-modal="${showModal ?: false}"
             tabindex="-1"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Create New User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="userForm" th:action="@{/users}" th:object="${userRequest}" method="post" novalidate>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text"
                                       class="form-control"
                                       id="fullName" name="fullName"
                                       placeholder="Enter full name"
                                       th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                >
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                                    Invalid full name
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email"
                                       class="form-control"
                                       id="email" name="email"
                                       placeholder="user@example.com"
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                >
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Invalid email address
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                th:field="*{password}"
                                th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                    Invalid password
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Repeat Password</label>
                                <input type="password" class="form-control" id="password-repeat" name="password-repeat"
                                th:field="*{confirmPassword}"
                                th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('confirmPassword')}"
                                     th:errors="*{confirmPassword}">
                                    Invalid password confirmation
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" name="role"
                                    th:field="*{role}"
                                    th:classappend="${#fields.hasErrors('role') ? 'is-invalid' : ''}">
                                    <option selected value="">Select a role...</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="USER">USER</option>
                                    <option value="MANAGER">MANAGER</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">
                            </div>


                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- start::scripts required for this view (Inside th:fragment="content") -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- end::scripts required for this view (Inside th:fragment="content") -->

        <!-- Bootstrap 5 JavaScript Bundle (incluye Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- start::Script to reopen the modal using the Bootstrap API when validation errors occur. -->
        <script>
            let modalInstance;

            document.addEventListener('DOMContentLoaded', () => {
                const modalElement = document.getElementById('userModal');
                if (modalElement) {
                    modalInstance = new bootstrap.Modal(modalElement);

                    // Lee si el servidor indicó abrir el modal tras una validación fallida
                    const shouldShow = modalElement.getAttribute('data-show-modal') === 'true';
                    if (shouldShow) {
                        modalInstance.show();
                    }
                }
            });

            function openModalForCreate() {
                document.getElementById('modalTitle').innerText = 'Nuevo Usuario';
                document.getElementById('userForm').action = '/users';
                document.getElementById('userId').value = '';
                document.getElementById('fullName').value = '';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('passwordGroup').style.display = 'block';
                if (modalInstance) modalInstance.show();
            }

            function openModalForEdit(button) {
                // Extraer atributos data-* del botón cliqueado
                const id = button.getAttribute('data-id');
                const fullName = button.getAttribute('data-fullname');
                const email = button.getAttribute('data-email');
                const role = button.getAttribute('data-role');

                console.log("Editing User ID:", id, fullName, email, role);

                document.getElementById('modalTitle').innerText = 'Edit User';
                document.getElementById('userForm').action = '/users/update/' + id;
                document.getElementById('userId').value = id;
                document.getElementById('fullName').value = fullName;
                document.getElementById('email').value = email;
                document.getElementById('role').value = role;

                if (modalInstance) modalInstance.show();
            }
        </script>
        <!-- end::Script to reopen the modal using the Bootstrap API when validation errors occur. -->
    </div>

</body>
</html>
